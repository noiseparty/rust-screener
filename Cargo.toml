[package]
name = "volume_screener"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
resolver = "3"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
