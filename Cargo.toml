[package]
name = "volume_screener"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
resolver = "3"

[lib]
name = "screener"
path = "src/lib.rs"

# The app window, and the terminal UI / --probe.
[[bin]]
name = "MarketGUI"
path = "src/main.rs"

[[bin]]
name = "MarketGUI-cli"
path = "src/bin/MarketGUI-cli.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
tungstenite = "0.30"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
ctrlc = "3.5.2"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
opaline = { version = "0.4", default-features = false, features = ["builtin-themes"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Media_Audio", "Wdk_System_SystemServices"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[build-dependencies]
embed-resource = "3"

